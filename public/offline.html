<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Courtload</title>
<style>
  :root { color-scheme: dark; --bg:#1b1b1b; --surface:#2a2a2a; --line:#4a4a4a; --fg:#f2efe8; --muted:#b5b1a8; --primary:#e8602c; --on-primary:#1b1b1b; --accent:#e8602c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:1rem; background:var(--bg); color:var(--fg);
         font-family: "Barlow", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width:100%; max-width:26rem; background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--primary); border-radius:6px; padding:1.5rem; }
  .eyebrow { margin:0 0 .5rem; font-size:.75rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
  h1 { margin:0 0 .5rem; font-family:"Bebas Neue", Impact, "Arial Narrow", sans-serif; font-weight:400; font-size:2.5rem; line-height:1.02; letter-spacing:.01em; text-transform:uppercase; }
  p { margin:0 0 1.25rem; color:var(--muted); line-height:1.5; }
  button { min-height:2.75rem; padding:.6rem 1.25rem; border:1px solid var(--primary); border-radius:6px; font:inherit; font-weight:600; cursor:pointer;
           background:var(--primary); color:var(--on-primary); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Courtload</p>
  <h1 id="t">Geen verbinding</h1>
  <p id="b">Je bent offline. Al bewaarde sets worden verstuurd zodra er weer verbinding is. Probeer het opnieuw als je weer bereik hebt.</p>
  <button id="r" type="button">Opnieuw proberen</button>
</main>
<script>
  if (/^en/i.test(navigator.language || "")) {
    document.documentElement.lang = "en";
    document.getElementById("t").textContent = "No connection";
    document.getElementById("b").textContent = "You are offline. Sets you already saved are sent as soon as you are back online. Try again once you have signal.";
    document.getElementById("r").textContent = "Try again";
  }
  document.getElementById("r").addEventListener("click", function () { location.reload(); });
</script>
</body>
</html>
