<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TeamWorkout</title>
<style>
  :root { --bg:#f6f3ec; --surface:#fff; --line:#e4ddcd; --fg:#15171b; --muted:#6b6a64; --primary:#1d6a47; --on-primary:#fff; --accent:#9a7b36; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0a0b0d; --surface:#121317; --line:#2a2d35; --fg:#f4f0e6; --muted:#9b9ca4; --primary:#a3e635; --on-primary:#0a0b0d; --accent:#d8c48e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:1rem; background:var(--bg); color:var(--fg);
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width:100%; max-width:26rem; background:var(--surface); border:1px solid var(--line); border-radius:1.5rem; padding:1.5rem; }
  .eyebrow { margin:0 0 .5rem; font-size:.68rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  h1 { margin:0 0 .5rem; font-size:1.5rem; line-height:1.15; letter-spacing:-.02em; }
  p { margin:0 0 1.25rem; color:var(--muted); line-height:1.5; }
  button { min-height:2.75rem; padding:.6rem 1.25rem; border:0; border-radius:.9rem; font:inherit; font-weight:600; cursor:pointer;
           background:var(--primary); color:var(--on-primary); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">TeamWorkout</p>
  <h1 id="t">Geen verbinding</h1>
  <p id="b">Je bent offline. Al bewaarde sets worden verstuurd zodra er weer verbinding is. Probeer het opnieuw als je weer bereik hebt.</p>
  <button id="r" type="button">Opnieuw proberen</button>
</main>
<script>
  if (/^en/i.test(navigator.language || "")) {
    document.documentElement.lang = "en";
    document.getElementById("t").textContent = "No connection";
    document.getElementById("b").textContent = "You are offline. Sets you already saved are sent as soon as you are back online. Try again once you have signal.";
    document.getElementById("r").textContent = "Try again";
  }
  document.getElementById("r").addEventListener("click", function () { location.reload(); });
</script>
</body>
</html>
